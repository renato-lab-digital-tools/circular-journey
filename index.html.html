var CE=[{"id":1,"zh":"循環設計","en":"Design for Circularity","qz":"就本次產品線而言，貴公司是否在設計或開發時，明確要求產品更容易維修、保養、升級、拆解、再次使用、翻新、再製造或回收？","qe":"For this product, has your company explicitly required during design or development that it be easier to maintain, repair, upgrade, disassemble, reuse, refurbish, remanufacture or recycle?","shortDefZ":"循環設計是以生命週期觀點重新思考產品或解決方案的設計，讓產品更容易維修、保養、升級、翻新、再製造或重複使用，藉此延長使用年限並降低資源消耗。","shortDefE":"","examplesZ":["將維修、換件、拆解或升級納入設計要求","採模組化、標準介面，並保留易耗損零件的拆裝空間","設定耐久、材料分離與回收要求，並納入設計審查","",""],"examplesE":["Include repairability, replaceable parts, disassembly or upgradeability in design requirements","Use modular designs, standard interfaces or commonly available fasteners","Provide access space for parts with high failure or wear rates","Set requirements for durability, part life, material separation or recycling compatibility","Check downstream repair, refurbishment or recycling feasibility during design reviews"],"tracesZ":["規範與要求：設計規格列有維修、換件、拆解、升級或回收要求","執行方式：測試或審查紀錄可確認耐久、拆裝或零件更換結果","持續追蹤：產品資料記錄材料組成、零件壽命與維修資訊"],"tracesE":["Documents: product requirements, design specifications, design checklists, DFMEA, drawings, BOMs and engineering changes","Records and data: durability tests, disassembly time, replaceable-part lists, maintainability tests and disassembly trials","Systems or physical evidence: module interfaces, service access points, standard parts, removable assemblies and part identification"],"nonZ":["僅有耐用、品質或永續宣稱，未有具體設計要求","僅延長保固，未改變產品設計","僅改善製程效率，較接近 #4「流程最佳化」",""],"nonE":["General claims that the product is high quality, durable or environmentally friendly","A long warranty without design features that support repair or part replacement","Production-efficiency improvements only","Using an environmentally preferable material without changing product life or value-retention design"],"defZ":"循環設計是以生命週期觀點重新思考產品或解決方案的設計，讓產品更容易維修、保養、升級、翻新、再製造或重複使用，藉此延長使用年限並降低資源消耗。\n透過適當設計，可提升產品的「循環次數」與「價值回收流程」效率，確保產品在生命週期結束後仍能被有效重複利用或回收，進而減少浪費並避免有害物質排放。循環設計從生命週期前端著手，是落實循環經濟最基礎且影響深遠的關鍵步驟。常見考量包括：採用模組化設計以提升可維修性、延長產品壽命；以及降低材料與結構複雜度，以提高回收與再循環的可行性。","defE":"Design for circularity means rethinking how a product or solution is designed so that it is easier to repair, maintain, refurbish, remanufacture, upgrade or reuse, thereby extending its useful life and reducing resource consumption.\nAppropriate design increases the efficiency of a product's \"cycling\" and value-recovery processes, ensuring that it can still be reused or recycled effectively at end of life, which reduces waste and avoids the release of hazardous substances. Because it addresses the front end of the life cycle, design for circularity is one of the most fundamental and far-reaching steps in implementing a circular economy. Common considerations include modular design to improve repairability and extend product life, and reducing material and structural complexity to improve recyclability."},{"id":2,"zh":"循環資源選用","en":"Circular Sourcing","qz":"就本次產品線而言，貴公司是否實際選用或明確要求再生材料、符合條件的可再生資源、原生資源替代方案，或避免特定令人關切的有害物質？","qe":"For this product, does your company actually use or formally require recycled materials, qualifying renewable resources, alternatives to virgin resources, or avoidance of specified substances of concern?","shortDefZ":"循環資源選用是指組織在推動循環經濟轉型時，以生命週期觀點檢視並規劃資源與材料的取得來源與選用策略。","shortDefE":"","examplesZ":["設定再生料含量或替代原生材料","採用可追溯、符合用途的可再生材料或回收零件","設定受關切物質限制及回收材料品質要求","",""],"examplesE":["Set recycled-content requirements for steel, plastics, paper or other materials","Use traceable renewable materials that meet defined conditions","Use recovered, reused or substitute inputs to reduce virgin-resource use","Specify prohibited, restricted or substitute substances","Require the safety, quality and suitability of recycled materials"],"tracesZ":["規範與要求：材料規格列有再生含量、材料來源、替代材料或物質限制","執行方式：供應商文件或檢測資料可確認實際材料、使用比例與來源批次","持續追蹤：材料系統記錄來源、再生含量與驗證狀態"],"tracesE":["Documents: material specifications, BOMs, restricted-substance lists, material approvals and substitution assessments","Records and data: recycled-content percentages, source batches, substance tests, supplier declarations and chain-of-custody records","Systems or physical evidence: ERP material attributes, traceability codes, SDSs, RoHS/REACH data and third-party verification"],"nonZ":["材料可以回收，不等於已使用再生或可再生材料\n","僅選擇本地或高品質材料，未改變來源與組成\n","一般永續評分未影響本產品的材料選擇",""],"nonE":["Calling a material circular simply because it is recyclable","Choosing only local, well-known or high-quality suppliers","Changing supplier scores without changing material selection","Using renewable materials without evidence of sustainable sourcing or replenishment"],"defZ":"循環資源選用是指組織在推動循環經濟轉型時，以生命週期觀點檢視並規劃資源與材料的取得來源與選用策略。\n其核心作法包括：優先採用再生資源與可再生資源，並以可行替代方案逐步降低對原生資源的依賴；同時在採購過程中避免使用令人關切的有害物質，並確保回收或已使用資源能被安全、合規地導入與使用。","defE":"Circular resourcing means that, as an organisation drives its circular-economy transition, it reviews and plans its sourcing of resources from a life-cycle perspective.\nCore practices include prioritising recycled and renewable resources and using feasible alternatives to progressively reduce dependence on virgin resources, while avoiding substances of concern during sourcing and ensuring that recycled or used resources are introduced and used safely and in compliance with regulations."},{"id":3,"zh":"循環採購","en":"Circular Procurement","qz":"貴公司是否把與產品壽命、材料來源、維修、回收或生命週期成本有關的要求，正式放進採購規格、供應商評選、合約或驗收流程？","qe":"Has your company formally included requirements relating to product life, material origin, repair, recovery or life-cycle cost in purchasing specifications, supplier selection, contracts or acceptance procedures?","shortDefZ":"循環採購是將循環經濟原則系統性納入採購策略、政策與流程，涵蓋採購指南、需求規範與供應商評估等環節；亦可透過導入數位服務、以租代買或採購服務等方式，降低營運過程的物質投入。","shortDefE":"","examplesZ":["將再生材料、耐久、維修或拆解要求納入採購規格","將備品、維修文件、取回或回收責任寫入合約","將總持有成本與循環條件納入供應商評選及驗收","",""],"examplesE":["Include recycled content, durability, repairability or disassembly requirements in RFQs, RFPs or drawings","Write spare-parts availability, repair documentation or take-back responsibilities into contracts","Add traceability, waste-reduction or recovery data to supplier evaluations","Procure repairable, refurbished or reusable products and services","Factor total cost of ownership or residual value into procurement decisions"],"tracesZ":["規範與要求：採購文件列有材料、耐久、維修、取回或回收條件","執行方式：評選與驗收紀錄顯示相關條件已納入實際決策","持續追蹤：採購系統保存供應商回覆、改善追蹤與核准紀錄"],"tracesE":["Documents: procurement policies, purchasing guides, RFQs/RFPs, supplier scorecards, contracts and acceptance criteria","Records and data: evaluation scores, supplier corrective actions, contract reviews and non-conformance records","Systems or physical evidence: SRM/ERP purchasing conditions, supplier data fields and approval workflows"],"nonZ":["單次購買較永續產品，未形成採購制度","採購評估仍只有價格、品質與交期","只有口頭偏好或供應商證書，未納入規格、合約或驗收",""],"nonE":["A one-off purchase of a product marketed as greener","Purchasing decisions based only on price, quality and delivery","Informal preferences or voluntary suggestions","A supplier holding an ISO certificate when circular criteria do not affect the purchasing decision"],"defZ":"循環採購是將循環經濟原則系統性地納入組織的採購策略、政策與流程，涵蓋採購指南、需求規範與供應商評估等各環節；亦可透過導入數位服務、以租代買或採購服務等方式，降低營運過程中的物質投入。\n循環採購不僅著重短期效益，更強調長期的循環性與資源閉環，促進供應鏈內資源的回收再利用。同時，組織可能需要調整合約與合作模式，以符合循環經濟的要求。","defE":"Circular procurement means systematically embedding circular-economy principles into an organisation's procurement strategy, policies and processes, covering procurement guidelines, requirement specifications and supplier evaluation; it can also reduce material inputs during operations by introducing digital services, leasing instead of buying, or procuring services.\nCircular procurement focuses not only on short-term benefits but also on long-term circularity and closed-loop resource use, promoting the recycling and reuse of resources within the supply chain. Organisations may also need to adjust contracts and cooperation models to meet circular-economy requirements."},{"id":4,"zh":"製程優化","en":"Process Optimization","qz":"貴公司是否曾改變本產品線的生產或相關流程，使每單位產品使用較少材料、能源或水，或產生較少廢料、損失與排放，並有改善前後的比較？","qe":"Has your company changed production or related processes for this product so that each unit uses less material, energy or water, or generates less waste, loss or emissions, with a comparison before and after the change?","shortDefZ":"流程最佳化指在生產、供應鏈或建築流程中，透過數據驅動來提升資源效率、降低資源與能源消耗、消除無附加價值的浪費並減少有害排放，進而實現資源最佳化。","shortDefE":"","examplesZ":["提升良率，減少報廢、重工與材料損失","改善製程、設備或參數，降低單位材料、能源或用水","導入廢熱、循環用水、溶劑或製程餘料回用","",""],"examplesE":["Improve yield and reduce scrap or rework","Remove unnecessary process steps or reduce changeover losses","Install energy-efficient equipment, heat recovery, water recirculation or solvent recovery","Optimise cutting, nesting, dosing or process parameters to reduce material use","Return by-products or surplus material into the same process"],"tracesZ":["規範與要求：改善文件設定材料、能源、水、廢料或排放目標","執行方式：改善前後資料可比較單位耗用、良率、廢料或排放","持續追蹤：製程系統記錄改善後績效與異常情形"],"tracesE":["Documents: improvement projects, A3/Kaizen reports, process changes, equipment investment assessments and SOPs","Records and data: before-and-after material, energy, water, yield, waste or emissions data per unit","Systems or physical evidence: MES, energy-management systems, meters, weighing records, waste ledgers and process monitoring"],"nonZ":["產量提高，但單位資源使用或排放未改善","僅降低財務成本，未確認資源或排放結果","將損失或污染轉移至其他製程或地點",""],"nonE":["Increasing output without improving resource efficiency per unit","Reducing cost without checking resource or emissions outcomes","Moving waste or pollution to another process","An improvement idea without an implemented change or before-and-after comparison"],"defZ":"流程最佳化指在生產、供應鏈或建築流程中，透過數據驅動來提升資源效率、降低資源與能源消耗、消除無附加價值的浪費並減少有害排放，進而實現資源最佳化。此行動涵蓋資源整合、技術流程改善與品質標準穩定，旨在減輕環境負擔並強化組織韌性。","defE":"Process optimisation means using data-driven approaches within production, supply-chain or construction processes to improve resource efficiency, reduce resource and energy consumption, eliminate non-value-added waste and reduce harmful emissions, thereby optimising resource use. This action covers resource integration, technical process improvement and stabilising quality standards, aiming to reduce environmental burden and strengthen organisational resilience."},{"id":5,"zh":"產業、區域或城市共生","en":"Industrial, Regional or Urban Symbiosis","qz":"貴公司是否與另一個組織建立持續運作的資源共享或交換，讓一方的剩餘能源、水、副產品、材料或閒置設施成為另一方的投入？","qe":"Has your company established an ongoing resource-sharing or exchange arrangement with another organisation, so that one party’s surplus energy, water, by-products, materials or idle facilities become inputs for the other?","shortDefZ":"共生是指區域內各組織在價值鏈上相互連結，透過共享與交換機制，提高基礎設施與各類資源（如能源、水與副產品）的使用效率，進而形成資源可循環流動的協作系統。","shortDefE":"","examplesZ":["將副產品、餘料或廢熱持續提供其他組織使用","使用其他組織的剩餘資源作為製程或產品投入","共享蒸汽、水處理、倉儲、運輸或其他設施",""],"examplesE":["Regularly supply by-products, offcuts or waste heat for use by another company","Use surplus materials from another organisation as inputs","Share steam, recirculated water, wastewater treatment, warehousing or equipment with nearby organisations","Operate an industrial-park or regional resource-exchange mechanism"],"tracesZ":["規範與要求：合作文件界定交換資源、品質條件、角色與責任","執行方式：交付紀錄記載批次、流量、替代量或品質結果","持續追蹤：共同運作資料記錄計量、物流、結算或設施使用"],"tracesE":["Documents: cooperation agreements, MOUs, resource-quality specifications and shared operating rules","Records and data: resource flows, delivery batches, substituted material quantities, shared costs and benefits","Systems or physical evidence: pipelines, shared equipment, handover records, weighing or metering, invoices and logistics records"],"nonZ":["公司內部回用，較接近 #4「流程最佳化」","一般廢料出售，沒有明確用途與持續交換安排","只有媒合、合作意向或一次性交換",""],"nonE":["Internal reuse within one company, which is closer to Action 4","Routine waste collection or sale of scrap","An intention to cooperate or a matchmaking meeting only","Ordinary supplier transactions without sharing surplus resources or facilities"],"defZ":"共生是指區域內各組織在價值鏈上相互連結，透過共享與交換機制，提高基礎設施與各類資源（如能源、水與副產品）的使用效率，進而形成資源可循環流動的協作系統。\n產業共生聚焦於地理位置相近的組織之間共享／交換資源，或將廢棄物轉化為他方的生產投入；區域或城市共生則延伸至資源、解決方案與基礎設施的共用。藉由跨組織協作，共生系統可提升整體資源與能源效益，並降低對環境、社會與經濟面的負面影響。","defE":"Symbiosis means that organisations within a region are interconnected across the value chain, using sharing and exchange mechanisms to improve the efficiency of infrastructure and resources such as energy, water and by-products, thereby forming a collaborative system in which resources can circulate.\nIndustrial symbiosis focuses on organisations in close geographic proximity sharing or exchanging resources, or turning one party's waste into another's production input; regional or city symbiosis extends this to shared resources, solutions and infrastructure. Through cross-organisational collaboration, symbiotic systems can improve overall resource and energy efficiency and reduce negative environmental, social and economic impacts."},{"id":6,"zh":"減量、再使用與變更用途","en":"Reduce, Reuse and Repurpose","qz":"貴公司是否曾避免製造或購買新的產品／資源，或讓使用過的產品、零組件在不被破壞的情況下再次使用，或改作其他用途？","qe":"Has your company avoided making or purchasing new products or resources, reused products or components without destroying them, or repurposed them for another use?","shortDefZ":"透過降低產品需求、重複使用產品或零組件，或將產品／零組件導入新的用途，以最大化資源效益。","shortDefE":"","examplesZ":["透過輕量化、共用或取消一次性物件減少需求","收回產品、包裝、容器或零件，確認後再次使用或重新配置","將無法維持原用途的產品或零件改作其他用途","",""],"examplesE":["Reduce product or material demand through lightweighting, shared tooling or avoiding single-use items","Collect and reuse whole products, packaging, pallets, containers or components","Redeploy returned, idle or retired equipment","Repurpose an item that can no longer perform its original function","Use qualified used parts in place of new components"],"tracesZ":["規範與要求：規格或程序列有減量、再使用、重新配置或改變用途的條件","執行方式：執行紀錄記載避免採購、回用品件或資產移轉數量","持續追蹤：管理資料追蹤舊件、容器、庫存與再次使用狀態"],"tracesE":["Documents: reuse standards, return or redeployment procedures, substitution decisions and design changes for reduction","Records and data: avoided purchases, reused-item counts, redeployed assets, returned-part inventory and estimated avoided new products","Systems or physical evidence: ERP inventory transfers, returnable containers, used-part stores, asset transfer forms and reuse labels"],"nonZ":["破碎、熔融或化學處理後再利用，較接近 #14「回收」或 #16「材料回復」","僅維修產品，尚未再次投入使用","只移動物件，未減少新品或新資源需求",""],"nonE":["Breaking down or melting material for reuse, which is closer to Actions 14 or 16","Repairing a product without putting it back into use","Moving an item without avoiding demand for a new product or resource","Claiming reduction without identifying the demand that was avoided"],"defZ":"透過降低產品需求、重複使用產品或零組件，或將產品／零組件導入新的用途，以最大化資源效益。\n本行動可應用於產線與產品，亦可延伸至組織日常營運。降低產品需求可藉由提升製造效率或減少天然資源消耗來達成；重複使用則需建立非破壞性的回收與取回機制；變更用途則是將廢棄或閒置的產品重新導入其他功能情境。","defE":"This maximises resource benefit by reducing demand for products, reusing products or components, or repurposing products or components for a new use.\nThis action can be applied to production lines and products, and can also extend to an organisation's day-to-day operations. Reducing product demand can be achieved by improving manufacturing efficiency or reducing consumption of natural resources; reuse requires establishing non-destructive collection and take-back mechanisms; repurposing means reintroducing discarded or idle products into other functional contexts."},{"id":7,"zh":"維護與維修","en":"Maintenance and Repair","qz":"貴公司是否對本產品線提供或執行定期保養、狀態監測或故障維修，使產品能維持或恢復原有功能，而不是因故障提早報廢？","qe":"Does your company provide or carry out scheduled maintenance, condition monitoring or fault repair for this product, so that it maintains or regains its intended function rather than being discarded early?","shortDefZ":"透過預防性或預測性維護，以及損壞後的修復，使產品恢復原有性能並延長使用壽命。","shortDefE":"","examplesZ":["進行預防性保養、定期檢查、校正或易耗損零件更換","以狀態監測進行預測維護，並診斷、修復故障","提供備品、維修資訊、技術人員或服務合約","",""],"examplesE":["Preventive maintenance, scheduled inspection, calibration and consumable replacement","Predictive maintenance using sensors or fault codes","Fault diagnosis, part replacement and functional repair","Provide spare parts, repair manuals, technicians or authorised service locations","Offer extended warranties or repair-service contracts"],"tracesZ":["規範與要求：服務文件載有保養計畫、維修程序、零件目錄或保固條款","執行方式：維修紀錄記載故障、工時、換件、測試與返修結果","持續追蹤：服務系統管理備件、遠端診斷與技術人員資料"],"tracesE":["Documents: maintenance plans, repair manuals, parts catalogues, service SOPs and warranty terms","Records and data: work orders, fault codes, repair time, spare-part use, repeat-repair rates and MTBF/MTTR","Systems or physical evidence: service centres, spare-part stores, remote-diagnostics platforms, repair tools and technician qualifications"],"nonZ":["僅清潔外觀，未維持或恢復功能","故障時直接更換整機，未進行診斷或修復","收回後整體更新較接近 #10「翻新」；重建至新品等級較接近 #11「再製造」",""],"nonE":["Cleaning appearance without maintaining or restoring function","Replacing the entire product without attempting repair","Rebuilding to new-product condition, which is closer to Action 11","A product that is theoretically repairable but lacks workable service arrangements"],"defZ":"透過預防性或預測性維護，以及損壞後的修復，使產品恢復原有性能並延長使用壽命。\n作為配套措施，企業應依產品年限提供備用零件、維修指引與維修服務，避免產品因輕微損壞即被汰換或丟棄。維修是延長產品生命週期的關鍵作法：透過維持既有功能，降低新增製造與資源投入所帶來的額外消耗。","defE":"This restores a product's original performance and extends its useful life through preventive or predictive maintenance, and through repair after damage occurs.\nAs a supporting measure, companies should provide spare parts, repair guidance and repair services appropriate to the product's age, to avoid products being replaced or discarded due to minor damage. Repair is a key way of extending a product's life cycle: by maintaining existing functionality, it reduces the additional consumption associated with new manufacturing and resource inputs."},{"id":8,"zh":"績效導向循環模式","en":"Performance-based Approaches","qz":"貴公司是否不是單純出售產品，而是以租賃、訂閱、按使用量或按績效收費提供產品功能，並由貴公司或指定方持續承擔維護、回收或生命週期末責任？","qe":"Rather than only selling the product, does your company provide its function through leasing, subscription, pay-per-use or performance-based charging, while your company or a designated party retains ongoing maintenance, return or end-of-life responsibilities?","shortDefZ":"企業保有產品所有權，使用者透過租賃、訂閱或按使用量付費等方式取得產品功能與服務，而非直接購買產品本身。以績效為基礎的做法有助於降低整體資源消耗，並提升產品使用效能。","shortDefE":"","examplesZ":["以訂閱，或依租期、使用量或績效收費","由供應方保留所有權或主要生命週期責任","將資產的維護、取回、翻新與重新配置納入服務","",""],"examplesE":["Fixed-term leasing or subscription where the provider retains ownership","Charging by use, time, throughput or output","Charging against availability, energy savings, capacity or service levels","Include maintenance, parts, asset management and return at contract end","Recover assets for redeployment, refurbishment or recycling"],"tracesZ":["規範與要求：合約列明付費標的、所有權、服務水準與取回責任","執行方式：履約資料記載使用量、績效、可用率、成本與退回數量","持續追蹤：資產系統管理計量、維護、取回與重新配置"],"tracesE":["Documents: lease, subscription or performance contracts, SLAs, return clauses and residual-value terms","Records and data: usage, performance, availability, asset utilisation, maintenance cost and returned-unit data","Systems or physical evidence: asset registers, metering or billing systems, maintenance platforms and return or redeployment processes"],"nonZ":["完成付款後轉移資產所有權，供應方不再承擔責任","融資租賃只提供資金，不管理維護、取回或殘值","僅有維修合約，較接近 #7「維護與維修」",""],"nonE":["Instalment payments or transfer of ownership after payment","Conventional finance leasing with no provider life-cycle responsibility","A repair contract where product function is still obtained through outright purchase","A service label without clear ownership, responsibility and return arrangements"],"defZ":"企業保有產品所有權，使用者透過租賃、訂閱或按使用量付費等方式取得產品功能與服務，而非直接購買產品本身。此模式將價值創造從產品銷售轉向服務績效，使企業持續負責產品維護、使用效率、生命週期管理與最終回收。以績效為基礎的做法有助於降低整體資源消耗，並提升產品使用效能。例如，業者提供依列印量計價的影印機租用服務。","defE":"The company retains ownership of the product, and users obtain its function and service through leasing, subscription or pay-per-use, rather than purchasing the product outright. This model shifts value creation from product sales to service performance, so the company remains responsible for maintenance, usage efficiency, life-cycle management and eventual recovery of the product. Performance-based approaches help reduce overall resource consumption and improve how effectively products are used. For example, a provider offers a copier rental service billed by print volume."},{"id":9,"zh":"透過共享提升使用密集度","en":"Sharing to Intensify Use","qz":"貴公司是否建立一個可運作的機制，讓多位使用者依序或共同使用同一項耐用產品或資產，並因此提高使用率或減少新增產品需求？","qe":"Has your company established a workable mechanism for multiple users to use the same durable product or asset sequentially or jointly, increasing utilisation or reducing demand for additional products?","shortDefZ":"透過共享耐久產品、資產或服務，可提高其使用率，避免每位潛在使用者都需購買並持有產品，進而降低整體產品需求、資源消耗與廢棄物產生。數位平台是推動此模式的關鍵工具，可降低共享服務的組織與管理成本，並改善媒合與使用流程，以提升整體使用效率。","shortDefE":"","examplesZ":["建立設備池、工具庫、車隊或其他共享資產","讓多位使用者在不同期間使用同一項資產","集中管理預約、調度、維護與損壞責任","",""],"examplesE":["Operate a shared equipment pool, tool library, fleet or asset platform","Allow different customers to use the same asset at different times","Provide booking, identity, payment and dispatch functions for multiple users","Share underused equipment across departments","Manage the maintenance and end-of-life recovery of shared assets"],"tracesZ":["規範與要求：共享規則列明使用、預約、調度與責任安排","執行方式：使用紀錄記載使用者、時數、使用率","持續追蹤：平台系統追蹤存取權限、位置、維護與調度"],"tracesE":["Documents: sharing rules, user contracts, asset-dispatch and maintenance requirements","Records and data: bookings, user counts, utilisation, idle time, avoided purchases and transport impacts","Systems or physical evidence: sharing platforms, asset pools, booking systems, access control and shared maintenance arrangements"],"nonZ":["製造商只把產品賣給共享平台，未參與共享營運","單一客戶專用租賃，沒有多位使用者共用","二手轉售只是所有權移轉，不是共享",""],"nonE":["Selling a product to a self-service or sharing platform and treating that as operating sharing","Leasing an asset exclusively to one customer","Second-hand resale","Sharing that increases transport, overuse or shortened life without assessing the net resource effect"],"defZ":"透過共享耐久產品、資產或服務，可提高其使用率，避免每位潛在使用者都需購買並持有產品，進而降低整體產品需求、資源消耗與廢棄物產生。數位平台是推動此模式的關鍵工具，可降低共享服務的組織與管理成本，並改善媒合與使用流程，以提升整體使用效率。","defE":"Sharing durable products, assets or services increases their utilisation, avoiding the need for every potential user to purchase and own a product, thereby reducing overall product demand, resource consumption and waste generation. Digital platforms are a key enabler of this model, lowering the cost of organising and managing shared services and improving matching and usage processes to raise overall utilisation."},{"id":10,"zh":"翻新","en":"Refurbishing","qz":"貴公司是否把使用過的整項產品收回後，進行有限度修復、零件更換或軟硬體更新，使它恢復原有或接近原有功能，再次投入使用？","qe":"Does your company take back a used complete product and carry out limited repair, part replacement or software and hardware updates so that it regains its original or near-original function and can be used again?","shortDefZ":"翻新是指對已使用產品進行有限度的修復、零件更換、維修或軟硬體更新，使其恢復原本或接近原本的功能狀態，藉此延長產品使用壽命。","shortDefE":"","examplesZ":["收回完整產品，進行檢查、清潔與狀態分級","更換零件、更新功能，並完成安全與品質測試","將翻新品再次銷售、出租或重新配置","",""],"examplesE":["Inspect, clean and grade returned used products","Replace worn, failed or obsolete parts and modules","Update software, firmware or functions","Complete functional, safety and quality tests","Resell, lease or redeploy the refurbished products"],"tracesZ":["規範與要求：翻新規格列有分級、換件、測試與保固條件","執行方式：翻新紀錄記載檢查、換件、工單與測試結果","持續追蹤：產品資料追蹤翻新品識別、數量與後續流向"],"tracesE":["Documents: refurbishment SOPs, grading criteria, standard replacement-part lists, test specifications and refurbished-product warranties","Records and data: incoming inspections, replacement BOMs, refurbishment work orders, test reports, quantities and destinations","Systems or physical evidence: refurbishment lines or stations, used-product identification, refurbished labels and resale or redeployment data"],"nonZ":["修復單一故障，較接近 #7「維護與維修」","僅清潔外觀或重新包裝，未恢復或更新功能","全面重建至新品等級，較接近 #11「再製造」",""],"nonE":["Routine servicing or repair of one fault","Cleaning and repackaging only","Dismantling solely for material recovery","Full rebuilding to new-product condition with a complete new-product warranty, which is closer to Action 11"],"defZ":"翻新是指對已使用產品進行有限度的修復、零件更換、維修或軟硬體更新，使其恢復原本或接近原本的功能狀態，藉此延長產品使用壽命。翻新不同於全面改造或再製造，其目的在於以較少的資源投入保留產品既有價值。翻新產品通常會提供保固，以向使用者或消費者保證其功能與品質。","defE":"Refurbishment means carrying out limited repair, part replacement, servicing or software/hardware updates on a used product to restore it to its original or near-original functional condition, thereby extending its useful life. Refurbishment differs from full overhaul or remanufacturing in that it aims to retain a product's existing value with a lower resource input. Refurbished products are typically offered with a warranty to assure users or consumers of their function and quality."},{"id":11,"zh":"再製造","en":"Remanufacturing","qz":"貴公司是否以標準化、工業化程序處理使用過的產品或核心零件，使其功能、性能與品質達到或高於新品水準，並提供完整保固？","qe":"Does your company use a standardised industrial process to treat used products or core components so that their function, performance and quality meet or exceed new-product levels, with a full warranty?","shortDefZ":"再製造是透過專業且受控的工業化程序，將已使用的產品或零組件恢復至新品等級，或重新組裝成具新品品質的產品，並提供完整保固。","shortDefE":"","examplesZ":["回收使用過的產品或核心零件","依標準程序拆解、清洗、修復、更換與重組","依新品規格測試、放行，並以完整保固重新上市","",""],"examplesE":["Operate a return system for used products or cores","Standardise disassembly, cleaning, inspection, repair, replacement and reassembly","Conduct complete functional, performance and safety testing against new-product specifications","Place remanufactured products on the market with dedicated identifiers, quality evidence and a full warranty","Meet applicable product regulations and liability requirements"],"tracesZ":["規範與要求：再製規格列有核心件、新品等同性、測試與保固要求","執行方式：製程紀錄記載追溯、用料、工序、測試與品質放行","持續追蹤：管理資料追蹤核心件庫存、再製品識別與保固狀態"],"tracesE":["Documents: remanufacturing processes, core specifications, new-product equivalence standards, regulatory assessments and full warranty terms","Records and data: core traceability, remanufacturing BOMs, process routes, test data, quality release and warranty records","Systems or physical evidence: dedicated remanufacturing lines, core inventories, product identification, standard times and quality systems"],"nonZ":["保養、維修僅恢復原有功能，較接近 #7「維護與維修」","有限更新但未達新品等同性，較接近 #10「翻新」","只有拆取舊件，未進行標準化重建",""],"nonE":["Ordinary repair, overhaul or refurbishment","Replacing a small number of parts without new-product equivalence requirements","Harvesting used parts as spares","No full warranty or evidence of regulatory conformity"],"defZ":"再製造是透過專業且受控的工業化程序，將已使用的產品或零組件恢復至新品等級，或重新組裝成具新品品質的產品，並提供完整保固。\n再製造產品的功能、性能與品質應達到或高於新品水準，並符合相關法規或標準要求。此做法可延長產品與零組件的使用壽命，降低對原生資源的需求，並減少相關環境衝擊。","defE":"Remanufacturing uses a specialised, controlled industrial process to restore used products or components to as-new condition, or to reassemble them into products of as-new quality, with a full warranty provided.\nRemanufactured products should match or exceed new-product levels of function, performance and quality, and comply with relevant regulations or standards. This practice extends the useful life of products and components, reduces demand for virgin resources, and lowers the associated environmental impact."},{"id":12,"zh":"逆向物流","en":"Reverse Logistics","qz":"貴公司是否已有可運作的退回、收集、運輸、分類或儲存安排，能把使用過、淘汰或剩餘的產品／零件帶回再使用、翻新、再製造或回收節點？","qe":"Does your company have workable return, collection, transport, sorting or storage arrangements that bring used, retired or surplus products and components back to reuse, refurbishment, remanufacturing or recycling points?","shortDefZ":"逆向物流是透過物流與回收系統，將已使用、淘汰或剩餘的產品、零件與材料導回價值鏈，以進行再使用、翻新、再製造、回收或其他資源化處理。","shortDefE":"","examplesZ":["提供退回、換購、產品取回或指定收集安排","集運、分類、暫存並分流退回產品或零件","追蹤回流來源、狀態、接收端與後續用途","",""],"examplesE":["Customer returns, trade-in, take-back or collection points","RMA processes, collection boxes, backhauling or scheduled collection","Consolidate, sort, store and route returned items","Use returnable packaging or transport containers","Track returned products, batches, status and receiving points"],"tracesZ":["規範與要求：退回文件列明取回流程、物流、返修授權與包裝要求","執行方式：回流紀錄記載退回單、數量、來源、狀態與用途","持續追蹤：追蹤系統掌握據點、暫存、運輸與分流"],"tracesE":["Documents: return terms, collection procedures, logistics contracts, RMA rules and packaging-return requirements","Records and data: return notes, transport documents, collected quantities, sources, condition, receiving points and subsequent uses","Systems or physical evidence: return labels, collection points, storage areas, reverse-logistics warehouses and tracking systems"],"nonZ":["只有取回承諾或網站說明，沒有實際物流安排","只有處理技術，但產品無法送達處理節點","客戶自行處理，企業未參與回流路徑",""],"nonE":["A take-back promise or website claim only","Processing technology without an arrangement that actually brings products back","Customers disposing of products themselves or finding their own recycler","Occasional returns without a workable return route"],"defZ":"逆向物流是透過物流與回收系統，將已使用、淘汰或剩餘的產品、零件與材料導回價值鏈，以進行再使用、翻新、再製造、回收或其他資源化處理。\n逆向物流是循環經濟的重要基礎設施，能確保資源穩定回流。其設計與執行品質會直接影響資源回收利用的效率、品質與經濟可行性。","defE":"Reverse logistics uses logistics and collection systems to bring used, retired or surplus products, parts and materials back into the value chain for reuse, refurbishment, remanufacturing, recycling or other resource-recovery processing.\nReverse logistics is important infrastructure for a circular economy, ensuring a stable flow of resources back into the system. The quality of its design and execution directly affects the efficiency, quality and economic viability of resource recovery."},{"id":13,"zh":"資源層級利用","en":"Cascading of Resources","qz":"貴公司是否為同一項產品、零件或材料安排至少兩個依序發生的用途，先保留較高功能或價值，再進入較低階用途，最後才回收或處理？","qe":"Has your company arranged at least two sequential uses for the same product, component or material, retaining higher function or value first, moving to lower-value uses later, and only then recycling or treating it?","shortDefZ":"資源層級利用是透過延伸價值鏈或促進不同價值鏈之間的合作，將無法再用於原用途的資源依序導入其他用途，使其在多次循環中持續創造價值。","shortDefE":"","examplesZ":["優先再使用完整產品，再翻新、拆件，最後才回收材料","讓高規格零件依序轉作較低規格用途","讓包裝、生質或其他資源依價值層級進入多個用途",""],"examplesE":["Reuse a complete product, then refurbish it, harvest parts and finally recycle materials","Use a high-grade component for its original purpose before moving it to a lower-specification use","Reuse packaging or containers multiple times before material recycling","Use biological resources for products first, then other uses, before an appropriate return to the biosphere"],"tracesZ":["規範與要求：分流規則列有品質門檻、用途順序與轉換條件","執行方式：轉移紀錄追蹤同一產品、零件或批次的多階段用途","持續追蹤：管理資料記錄分級、庫存、轉移與最終去向"],"tracesE":["Documents: condition grading, priority rules, quality thresholds and routing decision trees","Records and data: uses, quality changes, transfer quantities and final destinations for the same serial number or batch","Systems or physical evidence: grading areas, inventory for different uses, transfer forms, traceability codes and cross-use contracts"],"nonZ":["單次再使用，較接近 #6「減量、再使用與變更用途」","單次材料處理，較接近 #14「回收」","未經品質判斷與用途排序的任意降級使用，例如跳過可能的材料循環直接進行能源回收。",""],"nonE":["One-off second-hand reuse","One-off material recycling","Unplanned downcycling without sequence or quality decisions","Sending material to energy recovery while viable reuse, refurbishment or material-circulation options remain"],"defZ":"資源層級利用是透過延伸價值鏈或促進不同價值鏈之間的合作，將無法再用於原用途的資源依序導入其他用途，使其在多次循環中持續創造價值。此過程可能將資源轉向較低價值用途，也可能透過升級再造（upcycling）提升其價值；當資源無法再被材料利用時，才進入能源回收或其他最終處理。資源層級利用能更完整提取資源價值，並確保資源在多重利用中的效率與效益。","defE":"Cascading use of resources extends the value chain or fosters cooperation across different value chains, channelling resources that can no longer serve their original purpose into other uses so that they continue to create value across multiple cycles. This process may direct resources to lower-value uses, or increase their value through upcycling; only once a resource can no longer be used as a material does it move to energy recovery or other final treatment. Cascading use extracts more of a resource's value and helps ensure efficiency and benefit across multiple rounds of use."},{"id":14,"zh":"回收","en":"Recycling","qz":"就本次產品線相關的使用後物或廢料而言，貴公司是否自行或透過明確安排，進行物理、化學或生物處理，產出可再次使用的材料或資源，並能掌握輸入、處理、輸出與去向？","qe":"For used items or waste from this product, does your company carry out or explicitly arrange physical, chemical or biological processing that produces materials or resources for further use, with visibility of the inputs, process, outputs and destinations?","shortDefZ":"回收是透過物理、化學或生物程序，將已使用資源重新處理為可再次利用的材料或產品。選擇回收方式時，應評估資源品質是否能在處理過程中維持，是否會產生降級使用，以及回收流程本身的能源消耗與環境衝擊。","shortDefE":"","examplesZ":["拆解、破碎、分選或處理使用後物料，產出再生原料","評估回收產出的品質、用途與處理能耗","將再生材料供應回自身或其他產品使用","",""],"examplesE":["Dismantle, shred and sort items into recycled feedstock","Melt metals, re-pelletise plastics, depolymerise materials or regenerate solvents","Process qualifying biological resources into usable outputs","Assess the quality and energy inputs of recycled outputs","Feed recycled outputs back into own or other products"],"tracesZ":["規範與要求：回收規格列有輸入、處理、輸出與品質要求","執行方式：處理紀錄記載投入量、產出量、回收率、品質與用途","持續追蹤：流向資料追蹤再生材料庫存、出貨與使用端"],"tracesE":["Documents: recycling specifications, service contracts, input/output standards and quality acceptance criteria","Records and data: input and output quantities, recycling rates, quality grades, energy use and output buyers or uses","Systems or physical evidence: recycling equipment, process flows, weighbridge tickets, test reports and recycled-material shipment records"],"nonZ":["僅收集、分類與運送，較接近 #12「逆向物流」或 #15「廢棄物管理」","主要轉化為熱能、電力或燃料，較接近 #17「能源回收」","只宣稱可回收，無實際處理與再生輸出",""],"nonE":["Collection, sorting or transfer to a waste haulier only","Incineration with energy recovery, which is Action 17","Treatment with no usable output","Calling something recyclable without knowing the actual process or destination of recycled output"],"defZ":"回收是透過物理、化學或生物程序，將已使用資源重新處理為可再次利用的材料或產品。選擇回收方式時，應評估資源品質是否能在處理過程中維持，是否會產生降級使用，以及回收流程本身的能源消耗與環境衝擊。回收是支持資源持續循環的重要基礎措施，但應與減量、再使用、維修與再製造等更高價值策略搭配運用。","defE":"Recycling uses physical, chemical or biological processes to reprocess used resources into materials or products that can be used again. When choosing a recycling method, organisations should assess whether resource quality can be maintained during processing, whether downcycling will occur, and the energy consumption and environmental impact of the recycling process itself. Recycling is an important foundational practice for keeping resources in circulation, but should be used alongside higher-value strategies such as reduction, reuse, repair and remanufacturing."},{"id":15,"zh":"廢棄物管理","en":"Waste Management","qz":"貴公司是否已對本產品線相關製程或回收活動產生的廢棄物，建立辨識、分類、儲存、移交、處理與最終處置安排，並能追蹤主要數量或去向？","qe":"Has your company established identification, segregation, storage, transfer, treatment and final-disposal arrangements for waste from this product’s manufacturing or recovery activities, with tracking of major quantities or destinations?","shortDefZ":"廢棄物管理是透過妥善分類、收集、處理與處置廢棄物，降低資源損失並避免環境污染。","shortDefE":"","examplesZ":["依性質分類一般、可回收、有害及其他廢棄物","設置適當容器、標示、暫存與防污染措施","管理清運、合格處理與最終去向","",""],"examplesE":["Classify general, recyclable, hazardous and special wastes","Provide compliant containers, labels, temporary storage and pollution-prevention measures","Route recyclable streams to recycling and other waste to qualified treatment","Manage transport, treatment and final destinations","Regularly analyse waste volumes and anomalies"],"tracesZ":["規範與要求：管理文件包含廢棄物清冊、分類程序、許可與委託合約","執行方式：清運紀錄記載聯單、重量、處理方式與去向","持續追蹤：現場資料追蹤容器、暫存區、異常及主要廢棄物種類與流向"],"tracesE":["Documents: waste inventories, segregation SOPs, storage rules, treatment contracts and permits","Records and data: manifests, transport notes, weighbridge tickets, monthly reports, destinations, incidents and corrective actions","Systems or physical evidence: labelled bins, storage areas, hazardous-waste stores and waste-management systems"],"nonZ":["只有整理整頓，未管理廢棄物分類與去向","只說依法處理，無法辨識主要廢物流","混合清運，未依性質分類與管理",""],"nonE":["Housekeeping or 5S alone","Stating that waste is legally managed without identifying major streams and destinations","Mixing all waste before collection","A recycling-rate figure without a defined boundary or treatment route"],"defZ":"廢棄物管理是透過妥善分類、收集、處理與處置廢棄物，降低資源損失並避免環境污染。\n即使在循環經濟中，仍可能產生無法避免的廢棄物流，因此需透過有效管理，將可再利用或可回收的資源導回價值鏈，並確保無法回收的廢棄物受到安全且合規的處理。","defE":"Waste management reduces resource loss and prevents environmental pollution through proper sorting, collection, treatment and disposal of waste.\nEven within a circular economy, some unavoidable waste streams will still arise, so effective management is needed to route reusable or recyclable resources back into the value chain, and to ensure that waste which cannot be recovered is handled safely and in compliance with regulations."},{"id":16,"zh":"材料回復","en":"Material Recovery","qz":"貴公司是否從廢棄物流中，透過特定程序分離或提取某一種有價值材料，並讓該材料重新進入供應鏈或生產使用？","qe":"Does your company use a specific process to separate or extract a valuable material from a waste stream and return that material to supply-chain or production use?","shortDefZ":"材料回復是從被視為廢棄物或低價值資源的物質中，透過專業程序提取有價值的材料，並使其重新回到價值鏈。","shortDefE":"","examplesZ":["從混合廢料中分離特定金屬、塑膠、纖維或溶劑","對目標材料進行提取、純化或精煉","追蹤材料含量、回復率、純度與後續用途",""],"examplesE":["Recover copper, precious metals or critical materials from electronic waste","Separate specific metals, plastics, fibres or solvents from mixed waste","Purify, refine or adjust the quality of a target material","Supply recovered materials for internal use or to a specified buyer"],"tracesZ":["規範與要求：回復規格列有目標材料、處理技術、品質與法規條件","執行方式：材料紀錄記載材料含量、回復率、純度與產出批次","持續追蹤：流向資料追蹤回復材料庫存、買方與使用端"],"tracesE":["Documents: input specifications, target materials, recovery technology, quality standards and regulatory conditions","Records and data: material content, recovery yield, purity, output batches, tests and users or buyers","Systems or physical evidence: sorting or extraction equipment, analytical instruments, recovered-material inventory and shipment records"],"nonZ":["只泛稱有回收，未說明目標材料、品質與用途","只收集或拆解，較接近 #12「逆向物流」或 #15「廢棄物管理」","一般回收但未辨識特定材料，較接近 #14「回收」",""],"nonE":["Claiming recycling without identifying the material recovered","Collection or dismantling without a material-extraction output","Selling general scrap without confirming subsequent material recovery","Energy recovery or final disposal"],"defZ":"材料回復是從被視為廢棄物或低價值資源的物質中，透過專業程序提取有價值的材料，並使其重新回到價值鏈。\n常見作法包括都市採礦、掩埋場採礦與特定廢棄物流的材料提取。實施前應掌握資源組成、材料規格、可行技術、污染風險與法規限制，以評估其經濟與環境可行性。材料回復有助於閉合資源循環並降低對原生資源的依賴。","defE":"Material recovery uses specialised processes to extract valuable materials from substances that would otherwise be treated as waste or low-value resources, returning them to the value chain.\nCommon practices include urban mining, landfill mining and material extraction from specific waste streams. Before implementation, organisations should understand resource composition, material specifications, feasible technologies, contamination risk and regulatory constraints, in order to assess economic and environmental feasibility. Material recovery helps close the resource loop and reduces dependence on virgin resources."},{"id":17,"zh":"能源回收","en":"Energy Recovery","qz":"對於已確認無法再使用、翻新、再製造或材料回收的剩餘物，貴公司是否安排將其轉為實際被利用的熱能、電力或其他能源？","qe":"For residual material confirmed as unsuitable for reuse, refurbishment, remanufacturing or material recovery, does your company arrange conversion into heat, electricity or another form of energy that is actually used?","shortDefZ":"能源回收是在資源已無法再以材料形式循環利用時，透過特定處理技術將其轉化為可用能源，例如熱能、電力或燃料。此方法通常位於資源層級利用的後端，應在減量、再使用、維修、再製造與材料回收等選項不可行後才採用。","shortDefE":"","examplesZ":["將無法再循環的剩餘物送往具能源利用的處理設施","將適合的剩餘物轉為燃料、沼氣、熱能或電力","說明再使用、翻新、再製或材料回收為何不可行","",""],"examplesE":["Send non-recyclable residues to an incineration facility with energy utilisation","Produce RDF or SRF for use in an energy facility","Generate and use biogas through anaerobic digestion","Use a defined conversion technology to produce usable fuel, heat or electricity","Document why higher-value pathways are not feasible"],"tracesZ":["規範與要求：評估文件列有廢棄物階層、熱值、適用性與處理要求","執行方式：能源紀錄記載投入量、效率、產出與實際使用端","持續追蹤：處理資料保存能源利用證明與餘渣去向"],"tracesE":["Documents: waste-hierarchy assessments, calorific-value and suitability reviews, treatment contracts and evidence of energy use","Records and data: inputs, conversion efficiency, heat or electricity output, actual users and residue destinations","Systems or physical evidence: energy-recovery facility data, meters, energy certificates and treatment reports"],"nonZ":["一般焚化，沒有能源實際利用資料","可再使用或材料回收的物料直接進入能源處理","只有處理商名稱，無技術、能源產出與去向資料",""],"nonE":["Ordinary incineration without energy-use data","Direct incineration of recyclable materials","Using energy recovery to justify avoidable waste","Knowing only the treatment company, not the technology or energy destination"],"defZ":"能源回收是在資源已無法再以材料形式循環利用時，透過特定處理技術將其轉化為可用能源，例如熱能、電力或燃料。此方法通常位於資源層級利用的後端，應在減量、再使用、維修、再製造與材料回收等選項不可行後才採用。能源回收可在無法避免廢棄物產生時保留部分資源價值，但不應取代較高價值的循環策略。","defE":"Energy recovery converts resources that can no longer be recycled as materials into usable energy, such as heat, electricity or fuel, using specific processing technologies. This method typically sits at the back end of the resource cascade and should only be used once options such as reduction, reuse, repair, remanufacturing and material recycling are no longer feasible. Energy recovery can retain some resource value when waste generation is unavoidable, but should not replace higher-value circular strategies."},{"id":18,"zh":"生態系統再生","en":"Regenerate Ecosystems","qz":"貴公司的產品、材料來源或營運是否與某一個已退化的土壤、水域、棲地或其他自然系統有關，且貴公司已採取措施使其生態功能相較基準狀態獲得恢復？","qe":"Are this product, its material sources or your operations linked to a degraded soil, water body, habitat or other natural system, and has your company taken action that restores its ecological functions against a defined baseline?","shortDefZ":"生態系統再生是指在生產、使用或資源管理過程中，主動恢復、修復或改善退化的自然環境，以重建生態系統的功能與韌性。","shortDefE":"","examplesZ":["修復受污染或退化的土壤、水體或棲地","恢復生物多樣性、水文或其他生態功能","依基準狀態持續監測修復與韌性改善",""],"examplesE":["Restore contaminated or degraded soil, water bodies and habitats","Restore biodiversity, natural-resource supply or hydrological functions","Apply monitored regenerative agriculture or forestry at material-source locations","Maintain a long-term plan for improving ecological function and resilience"],"tracesZ":["規範與要求：計畫文件包含基準調查、修復目標與管理方案","執行方式：比較土壤、水質、生物多樣性或水文變化的成效","持續追蹤：可追蹤場址、來源地與生態功能變化的監測紀錄"],"tracesE":["Documents: baseline ecological assessments, restoration plans, land or water-management plans and sourcing requirements","Records and data: soil, water quality, biodiversity, ground cover, natural-resource supply or resilience indicators","Systems or physical evidence: field monitoring, GIS, third-party ecological assessments and long-term maintenance records"],"nonZ":["一般減排、節水或植樹，未恢復特定生態功能","公益活動沒有基準、修復目標與成效監測","只避免新增破壞，未修復既有退化",""],"nonE":["General emissions reduction, water saving, tree planting or legal compliance","A community project without a baseline and ecological-function improvement","Avoiding further damage without restoring existing degradation","Purchasing carbon offsets without restoring a specific ecosystem"],"defZ":"生態系統再生是指在生產、使用或資源管理過程中，主動恢復、修復或改善退化的自然環境，以重建生態系統的功能與韌性。相關作法可包括土壤修復、水域淨化、棲地復育、氣候調節與生物多樣性保護，目的在於恢復自然資源供應與生態系服務。例如：產品在廢棄後可安全堆肥並回歸土壤，有助於改善土壤健康。","defE":"Ecosystem regeneration means actively restoring, repairing or improving degraded natural environments during production, use or resource management, in order to rebuild ecosystem function and resilience. Related practices can include soil remediation, water-body purification, habitat restoration, climate regulation and biodiversity protection, aiming to restore the supply of natural resources and ecosystem services. For example, a product that can be safely composted and returned to the soil at end of life helps improve soil health."},{"id":19,"zh":"教育與研究","en":"Education and Research","qz":"貴公司是否已針對循環經濟，實施明確的教育、專業培訓或研究，使員工具備新的循環能力，或產生可用於循環轉型的新知與方法？","qe":"Has your company provided defined circular-economy education, professional training or research that builds new circular capabilities or generates knowledge and methods that can be used in circular transition?","shortDefZ":"教育與研究旨在建立循環經濟所需的知識、技能與能力，協助組織、員工與使用者從線性模式轉向循環模式，並有效運用現有工具與方法。","shortDefE":"","examplesZ":["針對本產品線的循環設計、維修、再製、回流或材料問題安排專業培訓","研究具體的材料替代、延壽、價值回復或循環商業問題","與學校或研究機構共同試驗，並將成果帶入規格、流程或工具",""],"examplesE":["Training in circular design, repair, refurbishment, remanufacturing or recycling skills","Education on material circulation, life cycles, responsible consumption or resource use","Research on reuse, substitute materials, recycling technology or circular business models","Develop training materials, methods or trials with universities or research institutes"],"tracesZ":["目標與連結：課程或研究計畫明確對應本產品線的能力需求或循環問題","實際運作：教材、參訓、測驗、研究或試驗紀錄可確認活動內容與參與情形","採用與結果：研究或學習成果已納入規格、程序、工具或人員能力要求"],"tracesE":["Documents: course outlines, research plans, annual training plans and collaborative research agreements","Records and data: materials, attendance, competence tests, research reports, papers, patents, trials and adoption results","Systems or physical evidence: learning platforms, research databases, test sites and demonstration projects"],"nonZ":["一般安全、品質或操作訓練，未對應循環能力","一次性宣導活動，沒有明確學習目標或後續運用","研究成果未進入本產品線的決策或工作方式",""],"nonE":["General safety, quality, operating or regulatory training","General product R&D with no link to the shift from linear to circular systems","Awareness events without defined learning or research outputs","Using a sustainability label when the content contains no circular knowledge or skills"],"defZ":"教育與研究旨在建立循環經濟所需的知識、技能與能力，協助組織、員工與使用者從線性模式轉向循環模式，並有效運用現有工具與方法。相關作法包括專業培訓、能力建構、創新研究、責任消費教育，以及資源使用與生命週期思維的推廣。","defE":"Education and research aim to build the knowledge, skills and capabilities needed for a circular economy, helping organisations, employees and users shift from a linear to a circular model and make effective use of existing tools and methods. Related practices include professional training, capacity building, innovation research, responsible-consumption education, and promoting resource-use and life-cycle thinking."},{"id":20,"zh":"創新","en":"Innovation","qz":"貴公司是否為了解決一個明確的資源、延壽、回流或價值回復問題，開發、測試或導入相較既有做法有實質新變化的技術、產品、制度或商業模式？","qe":"To address a defined resource, life-extension, return-flow or value-recovery problem, has your company developed, tested or introduced a technology, product, system or business model with a substantive change from current practice?","shortDefZ":"創新涵蓋技術、制度、商業模式與社會層面的變革，包括產品與服務設計、回收與再利用技術、商業模式創新及政策工具發展，並強調跨域知識流動與合作，以推動循環方案落地。","shortDefE":"","examplesZ":["為明確的資源、延壽、回流或價值回復問題開發新解法","以原型、試點或小規模測試驗證技術與商業條件","依測試結果決定導入、調整、擴大或停止方案","",""],"examplesE":["Develop a new modular, repairable or easy-to-disassemble product solution","Test new substitute materials, recycling or material-recovery technologies","Create new take-back, refurbishment, reuse or product-service models","Use cross-sector data or social approaches to overcome existing constraints","Validate technical and commercial feasibility through pilots"],"tracesZ":["問題與目標：創新文件說明要處理的問題、預期改變與適用範圍","測試與驗證：原型、試點、測試或商業案例紀錄呈現方法與結果","採用與決策：評估紀錄顯示方案已導入、調整、擴大或停止"],"tracesE":["Documents: innovation project briefs, problem definitions, technology roadmaps, business-model designs and pilot plans","Records and data: prototypes, patents, TRLs, test reports, pilot results, business cases and adoption data","Systems or physical evidence: demonstration lines, prototypes, test platforms, new processes or contracts"],"nonZ":["例行改善或一般版本更新，沒有實質新方法","單純購買新設備或軟體，未改變作法或驗證循環用途","只有概念或提案，尚未開發、測試或作出採用決定",""],"nonE":["Simply purchasing an off-the-shelf tool","Routine continuous improvement or feature upgrades","A new technology unrelated to a circularity problem","An idea that has not been developed, tested or introduced"],"defZ":"創新涵蓋技術、制度、商業模式與社會層面的變革，包括產品與服務設計、回收與再利用技術、商業模式創新及政策工具發展，並強調跨域知識流動與合作，以推動循環方案落地。","defE":"Innovation covers change at the technical, institutional, business-model and social levels, including product and service design, recycling and reuse technologies, business-model innovation and the development of policy tools, and emphasises cross-domain knowledge flow and collaboration to help circular solutions take hold."},{"id":21,"zh":"協作與網絡","en":"Collaboration and Networks","qz":"貴公司是否與其他部門或外部組織，為一個明確的循環目標建立持續合作，分配角色、共享資料或資源，並共同執行實際行動？","qe":"Has your company established ongoing cooperation with other departments or external organisations for a defined circular objective, assigning roles, sharing data or resources and jointly carrying out practical actions?","shortDefZ":"協作與網絡透過跨組織、跨部門與跨價值鏈合作，促進資源共享、資訊交流、知識傳遞與聯合行動，提升資源循環效率；同時需要利害關係人積極參與，建立清楚分工與有效合作機制。","shortDefE":"","examplesZ":["與其他部門、供應商、客戶或服務夥伴設定共同循環目標與角色","串接取回、維修、翻新、再製、回收或資料交換流程","建立可持續運作的協調、共享資源或共同執行機制","",""],"examplesE":["Co-develop circular materials or repairable parts with suppliers","Work with customers on product take-back, reuse or data exchange","Build closed-loop processes with logistics, repair, refurbishment and recycling partners","Manage design, procurement, service and return flows across departments","Set shared KPIs, governance and decision-making mechanisms"],"tracesZ":["共同安排：合作文件界定目標、角色、責任、資料與治理方式","聯合執行：專案、流程或平台紀錄顯示各方實際分工與共同作業","持續成果：共同服務、共享資料、處理量或其他聯合成果持續產生"],"tracesE":["Documents: cooperation agreements, MOUs, governance charters, RACI matrices, shared objectives and KPIs","Records and data: recurring meetings, shared data, joint projects, joint outputs and take-back or reuse quantities","Systems or physical evidence: cross-organisation platforms, data-exchange interfaces, shared processes and service networks"],"nonZ":["一次性會議、參訪或工作坊，沒有共同執行","只有協會會員資格，未參與本產品線的具體行動","一般買賣或委外關係，沒有共同目標、分工或資料共享",""],"nonE":["A one-off meeting, exchange or site visit","Membership in an industry association","Ordinary supplier transactions or customer relationships","Intent without joint action, assigned roles or an ongoing mechanism"],"defZ":"協作與網絡透過跨組織、跨部門與跨價值鏈合作，促進資源共享、資訊交流、知識傳遞與聯合行動，提升資源循環效率；同時需要利害關係人積極參與，建立清楚分工與有效合作機制。","defE":"Collaboration and networks promote resource sharing, information exchange, knowledge transfer and joint action through cross-organisational, cross-departmental and cross-value-chain cooperation, improving the efficiency of resource circulation; this also requires active stakeholder participation and clear division of responsibilities with effective cooperation mechanisms."},{"id":22,"zh":"協助使用者改變行為","en":"Helping Users Change Their Behaviour","qz":"貴公司是否針對一項明確的使用者行為，例如減量、正確使用、維修、共享、歸還或回收，提供容易採用的替代方案或介入，並觀察使用者是否真的改變行為？","qe":"For a defined user behaviour—such as reduction, correct use, repair, sharing, return or recycling—does your company provide an easy-to-adopt alternative or intervention and observe whether users actually change their behaviour?","shortDefZ":"協助使用者改變行為，是透過清楚資訊、可取得的替代方案、數位平台、誘因設計與社會創新，降低行為改變阻力，引導使用者採取更循環的消費與生活方式。","shortDefE":"","examplesZ":["辨識使用者在正確使用、維修、共享、歸還或回收上的具體障礙","提供更容易採用的服務、介面、預設選項、押金或獎勵","觀察實際使用、維修、歸還或回收行為，並調整介入方式","",""],"examplesE":["Use product interfaces to prompt proper dosage, loading, maintenance or energy-efficient operation","Use deposits, buy-back, rewards or defaults to encourage return and recycling","Provide accessible repair, refill, sharing or collection services","Use digital tools to reduce participation and choice barriers","Continuously adjust interventions using behavioural data"],"tracesZ":["目標行為：介入方案明確界定希望改變的行為、對象與使用流程","介入運作：服務、介面、獎勵或替代選項已有實際上線與使用紀錄","行為變化：資料可比較介入前後的使用、維修、共享、歸還或回收情形"],"tracesE":["Documents: behavioural objectives, user journeys, intervention designs and reward or return rules","Records and data: actual choices, use, repair, sharing, returns, recycling rates or A/B tests","Systems or physical evidence: product interfaces, apps, collection points, prompts, defaults and reward mechanisms"],"nonZ":["只有環境資訊或宣傳，沒有可採取的替代方案","只調查態度、認知或意願，沒有實際行為資料","提供服務或選項，但未針對明確行為，也未觀察是否被採用",""],"nonE":["General information or promotion only","Surveying attitudes, satisfaction or intention only","No actionable alternative available to the user","Marketing activity unrelated to circular behaviour"],"defZ":"協助使用者改變行為，是透過清楚資訊、可取得的替代方案、數位平台、誘因設計與社會創新，降低行為改變阻力，引導使用者採取更循環的消費與生活方式。","defE":"Helping users change behaviour means lowering the barriers to behaviour change through clear information, accessible alternatives, digital platforms, incentive design and social innovation, guiding users towards more circular patterns of consumption and daily life."},{"id":23,"zh":"政策與法律體系","en":"Policy and Legal System","qz":"針對由主管機關或具治理權限組織主導、且與本產品線相關的循環政策、法規、產品責任或公共採購制度，貴公司是否透過正式諮詢、資料提供、共同研議、試辦或執行回饋，實質參與其形成、修訂或落地？","qe":"For circular policies, regulations, product-responsibility requirements or public-procurement systems relevant to this product line that are led by a competent authority or governance body, has your company substantively participated in their formation, revision or implementation — for example through formal consultation, data provision, joint deliberation, pilot programmes or implementation feedback?","shortDefZ":"政策與法律體系為循環經濟建立支持性框架，透過目標設定、法規要求、經濟誘因、產品責任、資訊揭露與公共採購規則，引導組織與社會以系統性方式參與循環轉型。","shortDefE":"","examplesZ":["回應正式諮詢，提供與本產品線相關的材料、維修、產品責任或回流資料","透過協會、工作小組或共同研議參與制度形成或修訂","參與政策試辦、監理沙盒、示範計畫或公共採購驗證並提供回饋",""],"examplesE":["A public authority sets requirements for take-back, recycled content, durability, repair or product responsibility","A public body establishes mandatory circular-procurement rules","An authorised platform, industrial park or sector system sets shared obligations and enforcement mechanisms","Set incentives, fees, responsibilities or enforcement arrangements"],"tracesZ":["制度議題：內部文件說明參與的政策問題、產品線關聯與預期制度改變","正式參與：意見書、提交資料、會議紀錄、工作文件或試辦協議可確認實質投入","採納與後續：主管機關回覆、條文採納、試辦結果或後續修訂紀錄呈現影響"],"tracesE":["Documents: laws, orders, notices, formal policies, procurement rules and governance decisions","Records and data: covered parties, requirements or incentives, implementation procedures, audits, penalties and performance tracking","Systems or physical evidence: reporting, permitting, fee, inspection or scheme-management systems"],"nonZ":["只遵守、申報或被動回應已生效法規","只出席公聽會、論壇或持有協會會員資格","一般企業倡議或公共溝通，未進入正式制度程序",""],"nonE":["A manufacturer merely complying with regulation","An ordinary internal company policy","A policy proposal, white paper or research recommendation that has not been adopted","Participation in consultations or association discussions"],"defZ":"政策與法律體系為循環經濟建立支持性框架，透過目標設定、法規要求、經濟誘因、產品責任、資訊揭露與公共採購規則，引導組織與社會以系統性方式參與循環轉型。","defE":"Policy and legal systems build a supportive framework for the circular economy, guiding organisations and society to participate in the circular transition in a systematic way through target-setting, regulatory requirements, economic incentives, product responsibility, information disclosure and public-procurement rules."},{"id":24,"zh":"金融服務","en":"Financial Services","qz":"就本產品線或相關循環專案，貴公司是否已辨識並實際回應金融機構、投資人、保險業者或政府提供的永續／循環金融與財務支持措施，例如融資、投資、租賃、保險、補助、信用保證或利率優惠，並依其條件準備專案、資料、申請或持續績效管理？","qe":"For this product line or related circular projects, has your company identified and actually responded to sustainability/circular financial support measures offered by financial institutions, investors, insurers or government bodies — such as financing, investment, leasing, insurance, grants, credit guarantees or preferential interest rates — including preparing the project, data, application or ongoing performance management required by those measures?","shortDefZ":"金融服務可透過投資、融資、保險、風險評估與資金配置支持循環轉型；永續金融標準、分類法與評估工具有助於引導資金自線性與高資源消耗模式，轉向循環與低衝擊的永續模式。","shortDefE":"","examplesZ":["盤點適用於本產品線或循環專案的融資、投資、補助、保證或保險方案","將循環專案整理為明確的資金用途、條件、績效目標與商業案例","完成申請、核准或資金使用，並管理約定用途與成果",""],"examplesE":["Use repairability, take-back, recycled content or product-service models as financing conditions","Provide project finance for recovery, refurbishment, remanufacturing or asset-service models","Include residual value, return rates or circular performance in investment or insurance models","Adjust interest rates, premiums, limits or contract terms according to circular outcomes"],"tracesZ":["專案與條件：資格評估說明資金方案與特定循環專案、用途及條件的連結","申請與核准：申請書、審查資料、條件書、契約或投資核准可確認實際進程","使用與管理：資金撥付、支出、資本預算及約定成果紀錄可追蹤執行情形"],"tracesE":["Documents: credit or investment policies, term sheets, insurance terms, risk models and use-of-funds requirements","Records and data: circularity scores, amounts financed, interest or premium differences, monitoring indicators and use-of-funds reports","Systems or physical evidence: credit reviews, investment-committee papers, ESG/CE data fields and performance monitoring"],"nonZ":["只知道有相關方案，尚未評估資格或準備專案","一般貸款、租賃、保險或補助，沒有循環用途或條件","只使用綠色或永續名稱，資金用途與績效要求不清楚",""],"nonE":["Ordinary corporate loans, instalment payments or equipment leasing","A green label without circularity criteria","Funding unrelated to circular actions","Financing terms that do not change because of circularity"],"defZ":"金融服務可透過投資、融資、保險、風險評估與資金配置支持循環轉型；永續金融標準、分類法與評估工具有助於引導資金自線性與高資源消耗模式，轉向循環與低衝擊的永續模式。","defE":"Financial services can support the circular transition through investment, financing, insurance, risk assessment and capital allocation; sustainable-finance standards, taxonomies and assessment tools help steer capital away from linear, resource-intensive models and towards circular, lower-impact sustainable models."},{"id":25,"zh":"數位化","en":"Digitalization","qz":"貴公司是否使用產品識別、感測、資料平台或資料交換等數位技術，實際支援本產品線的維修、資源管理、回收、再使用、翻新或生命週期決策？","qe":"Does your company use product identification, sensors, data platforms or data exchange to directly support this product’s maintenance, resource management, take-back, reuse, refurbishment or life-cycle decisions?","shortDefZ":"數位化運用物聯網、區塊鏈、大數據、人工智慧等數位技術，強化產品設計、資源管理、維修服務、回收系統與資訊共享的透明度、可追溯性與效率，以支援全生命週期管理。","shortDefE":"","examplesZ":["以序號、QR 碼、標籤或數位護照識別產品與零組件","整合材料、感測、故障、維修、位置與回流資料","以數位平台支援維修、分級、再使用、翻新、再製或回收決策","",""],"examplesE":["Identify products and parts with serial numbers, QR/RFID or a digital product passport","Use IoT and fault data to support maintenance and life extension","Record material composition, repair history, ownership, location and condition","Use platforms to manage return, grading, reuse, refurbishment and recycling","Exchange circularity data with suppliers, customers or recyclers"],"tracesZ":["支援目的：資料需求明確說明要支援的產品線決策、流程或 CE Action","資料運作：資料欄位、介面、權限、更新責任及系統紀錄可確認實際運作","決策使用：操作或系統紀錄顯示資料已用於維修、回流、資源管理或價值回復"],"tracesE":["Documents: data dictionaries, system requirements, data governance, interface or exchange specifications, access rights and update responsibilities","Records and data: serial, sensor, fault, repair, material, location, return, treatment and decision records","Systems or physical evidence: ERP/PLM/MES/IoT, QR/RFID, repair platforms, recovery platforms, APIs and dashboards"],"nonZ":["只將紙本資料電子化，未改善識別、追蹤或決策","一般 ERP、網站或資料平台未支援具體循環流程","只蒐集或展示資料，未用於營運或生命週期決策",""],"nonE":["Converting paper records into electronic files only","General ERP, websites, email or mobile payment","Digital functions used only for marketing or payment without improving circular processes","Data that are collected but not used in a specific decision"],"defZ":"數位化運用物聯網、區塊鏈、大數據、人工智慧等數位技術，強化產品設計、資源管理、維修服務、回收系統與資訊共享的透明度、可追溯性與效率，以支援全生命週期管理。","defE":"Digitalisation applies digital technologies such as the Internet of Things, blockchain, big data and artificial intelligence to strengthen the transparency, traceability and efficiency of product design, resource management, repair services, recycling systems and information sharing, supporting management across the full life cycle."}];

function ceById(n){for(var k=0;k<CE.length;k++)if(CE[k].id===n)return CE[k];return null;}
function helpList(items,extraClass){var list=nonEmptyItems(items);return '<ul class="ce-help-list'+(extraClass?' '+extraClass:'')+'">'+list.map(function(x){return '<li>'+esc(x)+'</li>';}).join('')+'</ul>';}
function setCeTab(id,idx){S.ceTab[id]=idx;render();}
function isEmail(v){return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v||"");}
function updateAdmin(k,el){S.admin[k]=el.type==='checkbox'?el.checked:el.value;}
function reportPayload_(extra){
 var a=S.admin;
 var pt=ptById(S.pt);
 var md=(pt?modesFor(S.pt):[]).find(function(x){return x.mode===S.mode;});
 var p={submissionId:a.submissionId,email:a.email,productName:S.productName||'',company:a.company||'',contactName:a.name||'',jobTitle:a.title||'',taxId:a.tax||'',partner:a.partner||'',followup:!!a.followup,productTypeName:pt?pt.name:'',businessModelName:md?md.name:'',lang:LANG};
 for(var k in extra){p[k]=extra[k];}
 return p;
}
function handleSendResult_(res){
 // v9：後端一律會嘗試寄信（合併失敗時改寄不含附件的版本），mergeOk===false 代表
 // 這次寄出的信沒有附上正式 PDF（後端會人工補寄），不是前端需要重試的錯誤。
 if(res&&res.ok){S.admin.sent=true;S.admin.sendError=false;S.admin.sentOptimistic=!!res.optimistic;S.admin.sentNoAttachment=(res.mergeOk===false);}
 else{S.admin.sendError=true;}
 render();
}
function submitReport(){
 // v9 起：正式 PDF 報告改由後端（Code.gs mergeReport）用 Slides 樣板合併產生，
 // 前端只需要送 submissionId + 聯絡資訊，不再自己截圖產生 PDF 或傳 pdfBase64。
 if(!isEmail(S.admin.email))return;
 var btn=document.getElementById('sendReportBtn');
 if(btn){btn.disabled=true;btn.innerHTML=bi('寄送中…','Sending…');}
 postToBackend('sendReport',reportPayload_({})).then(handleSendResult_);
}
function updateSendBtn(){var b=document.getElementById('sendReportBtn');if(b){var ok=reportRequiredOk_(S.admin);b.disabled=!ok;b.className='btn '+(ok?'btn-p':'btn-d');}}
function adminField(k,zh,en,type,ph,full,required){var a=S.admin;return '<div class="'+(full?'full':'')+'"><label class="label">'+bi(zh,en)+(required?' <span class="req-mark">*</span>':'')+'</label><input type="'+(type||'text')+'" value="'+esc(a[k]||'')+'" placeholder="'+esc(ph||'')+'" oninput="updateAdmin(\''+k+'\',this);updateSendBtn()"></div>';}
function reportRequiredOk_(a){return !!(isEmail(a.email)&&a.company&&a.company.trim()&&a.name&&a.name.trim()&&a.title&&a.title.trim()&&a.tax&&a.tax.trim());}




function actionCompleteByNum(n){
 var a=actByNum(n),r=a&&S.ce[a.id];
 return actionComplete(r);
}
function allActionsComplete(){return answeredCount()===25;}
function nonEmptyItems(items){return (items||[]).filter(function(x){return String(x||'').trim()!=='';});}
function definitionList(text){return helpList(String(text||'').split(/\n+/),'ce-definition-list');}
function reportSection(){
 var a=S.admin;
 if(a.sent){
  var confirmMsg=a.sentOptimistic?bi('已送出；若稍後未收到，請直接聯繫我們。','Submitted. Contact us if the report does not arrive shortly.'):bi('完整報告已寄至您填寫的信箱。','The full report has been emailed to the address provided.');
  return '<div class="sec"><h3><span class="sec-num">07</span> '+bi('留下聯絡方式，取得完整報告與後續洞察','Leave your contact details for the full report and subsequent insights')+'</h3><div class="res ok"><b>'+bi('已送出 ✓','Submitted ✓')+'</b>　'+esc(a.email)+'<div class="ce-def-note" style="margin-top:6px">'+confirmMsg+'</div></div></div>';
 }
 var body=a.sendError?('<div class="notice warn" style="margin-bottom:14px">'+bi('寄送失敗，請確認網路後再試一次。','Sending failed. Check your connection and retry.')+'</div>'):'';
 body+='<div class="report-value"><h4>'+bi('留下聯絡方式後，您可以持續取得這次探索的完整成果與後續產業洞察。','Leave your contact details to receive the full output from this exploration and subsequent industry insights.')+'</h4><p>'+bi('本頁已呈現本次分析結果。留下聯絡方式的目的，是讓您取得更適合留存與跨部門閱讀的完整版本，並在年底收到本工具彙整形成的產業或企業類型洞察。','This page presents the analysis results from this exploration. Contact details are requested so you can receive a full version designed for retention and cross-functional reading, and year-end insights derived from aggregated tool responses by industry or company type.')+'</p><div class="benefit-grid"><div class="benefit-card"><b>'+bi('完整 Circular Opportunities Brief','Full Circular Opportunities Brief')+'</b><p>'+bi('以更適合閱讀與轉交的版面，完整呈現 25 項循環行動的企業角色、推動狀態、行動定義，以及在所選商業模式下的可能作用方式。','A more readable and shareable format covering company role, implementation status, definitions and potential mechanisms under the selected Business Model for all 25 Circular Economy Actions.')+'</p></div><div class="benefit-card"><b>'+bi('年底產業與企業類型洞察','Year-end industry and company-type insights')+'</b><p>'+bi('在符合資料治理與彙整條件下，提供由參與樣本形成的循環經濟趨勢、常見行動狀態、市場現況與啟發。公開內容描述參與樣本，不代表整體產業母體。','Subject to data-governance and aggregation rules, receive insights on circular-economy trends, common Action patterns, market developments and implications drawn from participating samples. Public findings describe the sample and are not population estimates.')+'</p></div></div></div>';
 body+='<div class="notice" style="margin-bottom:14px">'+bi('以下資料用於完整報告製作與寄送；只有在您勾選同意後，才會用於寄送年底產業／企業類型洞察及相關後續資訊。留下資訊不會改變本頁分析結果。','The information below is used to produce and deliver the full report. It will be used for year-end industry/company-type insights and related follow-up only if you opt in. Providing information does not change the analysis above.')+'</div><div class="field-grid">';
 body+=adminField('company','公司／組織名稱','Company / organisation','text','',false,true)+adminField('name','姓名','Name','text','',false,true)+adminField('title','職稱','Job title','text','',false,true)+adminField('email','Email','Email','email','name@company.com',false,true)+adminField('tax','統一編號','Business ID','text','',false,true)+adminField('partner','合作單位來源（選填）','Referring partner (optional)','text','',true,false);
 body+='</div><label class="consent-line"><input type="checkbox" '+(a.followup?'checked':'')+' onchange="updateAdmin(\'followup\',this)"><span>'+bi('我願意接收年底產業／企業類型洞察，以及與本計畫相關的後續資訊。','I would like to receive year-end industry/company-type insights and related Programme updates.')+'</span></label>';
 var ok=reportRequiredOk_(a);
 body+='<div style="margin-top:14px"><button class="btn '+(ok?'btn-p':'btn-d')+'" id="sendReportBtn" '+(ok?'':'disabled')+' onclick="submitReport()">'+bi('寄送完整報告','Email the full report')+'</button></div>';
